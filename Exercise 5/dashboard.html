<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Dashboard</title>
  <link rel="stylesheet" href="dashboard.css">
  <script src="https://d3js.org/d3.v7.min.js"></script>
</head>
<body>

<div class="dashboard-wrapper">

  <div class="dashboard-header">
    <h1>D3 Charts Dashboard</h1>
    <p>Analyzing TV energy consumption metrics and historical spot power prices.</p>
  </div>

  <div class="dashboard-grid">
    <div class="chart-card">
      <h2>1. Scatter Plot: Energy vs Star Rating</h2>
      <div id="scatter-plot" class="chart-container"></div>
    </div>

    <div class="chart-card">
      <h2>2. Donut Chart: Overall Tech Share</h2>
      <div id="donut-chart" class="chart-container"></div>
    </div>

    <div class="chart-card">
      <h2>3. Bar Chart: 55" TV Tech Comparison</h2>
      <div id="bar-chart" class="chart-container"></div>
    </div>

    <div class="chart-card">
      <h2>4. Line Chart: Spot Power Prices (1998-2024)</h2>
      <div id="line-chart" class="chart-container"></div>
    </div>
  </div>

</div>


<script src="js/script.js"></script>
<script src="d3 chart types/scatter.js"></script>
<script src="d3 chart types/line.js"></script>
<script src="d3 chart types/donut.js"></script>
<script src="d3 chart types/bar.js"></script>

</body>
</html>
